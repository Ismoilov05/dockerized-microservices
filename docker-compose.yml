services:

  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/appdb
      REDIS_HOST: redis

  product-service:
    build: ./product-service
    container_name: product-service

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - product-service

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: